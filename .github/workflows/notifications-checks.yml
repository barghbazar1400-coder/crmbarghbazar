name: CRM Live Notifications
on:
  push:
    branches: [main]
    paths:
      - 'inc/notifications.php'
      - 'inc/chat.php'
      - 'inc/chat-attachments.php'
      - 'inc/notifications-push.php'
      - 'assets/js/crmb-notices.js'
      - 'assets/js/crmb-chat.js'
      - 'assets/js/crmb-chat-image-modal.js'
      - 'tests/chat-image-modal.js'
      - 'assets/js/crmb-push-sw.js'
      - 'template-parts/messages.php'
      - 'template-parts/messages-list.php'
      - 'template-parts/notifications.php'
      - 'tests/notifications.php'
      - 'tests/notifications-client.js'
      - 'tests/notifications-popover.js'
      - 'style.css'
      - 'tests/notifications-sound.js'
      - 'tests/messages-live.php'
      - 'tests/chat.php'
      - 'tests/chat-attachments.php'
      - 'tests/chat-uploads-router.php'
      - 'tests/chat-uploads-http.js'
      - 'tests/work.php'
      - 'page-main.php'
      - '.github/workflows/notifications-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,mbstring,curl,openssl,zip,fileinfo
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint PHP templates and event backend
        run: |
          php -l inc/notifications.php
          php -l inc/chat.php
          php -l inc/chat-attachments.php
          php -l tests/chat-attachments.php
          php -l tests/chat-uploads-router.php
          php -l inc/notifications-push.php
          php -l template-parts/notifications.php
          php -l template-parts/messages.php
          php -l template-parts/messages-list.php
          php -l page-main.php
      - name: Lint browser and service worker JavaScript
        run: |
          node --check assets/js/crmb-notices.js
          node --check assets/js/crmb-chat.js
          node --check assets/js/crmb-chat-image-modal.js
          node --check tests/chat-image-modal.js
          node --check assets/js/crmb-push-sw.js
          node --check tests/notifications-client.js
          node --check tests/notifications-popover.js
          node --check tests/notifications-sound.js
          node --check tests/chat-uploads-http.js
      - name: Test PHP event permissions and message handling
        run: |
          php tests/notifications.php
          php tests/work.php
          php tests/messages-live.php
          php tests/chat.php
          php tests/chat-attachments.php
      - name: Test Windows notification polling, consent and chime
        run: |
          node tests/notifications-client.js
          node tests/notifications-popover.js
          node tests/notifications-sound.js
      - name: Chat private image modal and file fallback
        run: node tests/chat-image-modal.js
      - name: Test true HTTP multipart upload and private download
        run: node tests/chat-uploads-http.js
